
name: Build Electron App

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "electron/native/project-thumbnail/**"
      - "scripts/build-project-thumbnail.mjs"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows-media-tools:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev nasm pkg-config cmake meson ninja-build clang-14
      - name: Build FFmpeg and FFprobe with shared libraries
        run: bash scripts/build-windows-media-tools.sh .tmp/windows-media-tools-x64
      - name: Upload the Windows media runtime
        uses: actions/upload-artifact@v4
        with:
          name: windows-media-tools-x64
          path: .tmp/windows-media-tools-x64
          if-no-files-found: error
          include-hidden-files: true

  build-windows:
    runs-on: windows-latest
    needs: build-windows-media-tools
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('Release tag does not match version ' + version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Download the Windows media runtime
        uses: actions/download-artifact@v4
        with:
          name: windows-media-tools-x64
          path: .tmp/windows-media-tools-x64

      - name: Build Windows app
        shell: pwsh
        run: |
          $env:LEADCUT_WINDOWS_MEDIA_TOOLS_DIR = (Resolve-Path '.tmp/windows-media-tools-x64').Path
          node scripts/prepare-leadcut-installer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:platform-native-helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run normalize:electron-main-cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run smoke:electron-main-cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win dir nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem -LiteralPath release -File -Filter '*-windows-x64.exe' | Select-Object -First 1
          if (-not $installer -or $installer.Length -gt 125000000) {
            throw "Windows installer is missing or exceeds the 125 MB budget"
          }

      - name: Smoke test packaged Windows paths
        run: npm run smoke:packaged-binaries

      - name: Test the packaged MCP workflow
        shell: pwsh
        run: |
          $env:LEADCUT_PACKAGED_SMOKE_EXE = (Resolve-Path 'release/win-unpacked/LeadCut.exe').Path
          Push-Location services/leadcut-mcp
          node --test tests/packaged.test.mjs
          exit $LASTEXITCODE

      - name: Generate Windows artifact checksums
        run: npm run checksums:release

      - name: Attest Windows artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows artifacts to the release
        if: github.ref_type == 'tag' && github.repository == 'AzenYes/LeadCut'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -Path release -File | Where-Object { $_.Name -match '\.exe(\.blockmap)?$|^latest\.yml$|^SHA256SUMS\.txt$' } | ForEach-Object FullName)
          if (-not (Test-Path -LiteralPath 'release/latest.yml')) { throw 'Missing update metadata' }
          $existingAssets = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -eq 0) {
            $present = @($assets | Where-Object { $existingAssets -contains (Split-Path -Leaf $_) })
            if ($present.Count -eq $assets.Count) {
              Write-Host 'Windows release assets are already complete.'
              exit 0
            }
            if ($present.Count -gt 0) { throw 'Existing Windows release assets are incomplete.' }
            gh release upload $tag @assets
          } else {
            $flags = @()
            if ($tag.Contains('-')) { $flags += '--prerelease' }
            gh release create $tag @assets @flags --verify-tag --generate-notes
          }
          exit $LASTEXITCODE

  build-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            arch_tag: darwin-x64
            runner: macos-15-intel
          - arch: arm64
            arch_tag: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build macOS app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --mac dir dmg zip --${{ matrix.arch }} --publish never

      - name: Smoke test packaged macOS paths
        env:
          PACKAGED_SMOKE_ARCH_TAGS: ${{ matrix.arch_tag }}
        run: npm run smoke:packaged-binaries

      - name: Generate macOS artifact checksums
        run: npm run checksums:release -- SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Attest macOS artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  build-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxtst-dev libxkbfile-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Remove stale uiohook build output
        run: rm -rf node_modules/uiohook-napi/build

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Linux app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --linux dir AppImage --x64 --publish never

      - name: Smoke test packaged Linux paths
        run: npm run smoke:packaged-binaries

      - name: Generate Linux artifact checksums
        run: npm run checksums:release -- SHA256SUMS-linux.txt

      - name: Attest Linux artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-linux.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            release/**/*.AppImage
            release/**/*.blockmap
            release/latest-linux.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30
